<style>
  @import url('https://googleapis.com');

  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    margin: 0 auto;
    border: 2px solid #00f3ff;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(0, 243, 255, 0.1);
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00f3ff;
    background: #04060e;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .scanlines {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 4;
  }
  .screen-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(10, 18, 36, 0.85) 0%, rgba(4, 6, 14, 0.96) 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 10;
    backdrop-filter: blur(4px);
  }
  .hidden {
    display: none !important;
  }
  #game-wrapper h1 {
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    font-weight: 900;
    letter-spacing: 3px;
    margin: 0 0 10px;
    background: linear-gradient(90deg, #00f3ff, #ffffff, #00f3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.8));
  }
  #gameover-screen h1 {
    background: linear-gradient(90deg, #ff2a6d, #ff8a00, #ff2a6d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(255, 42, 109, 0.8));
  }
  .tagline {
    color: #a0b2c6;
    font-size: clamp(0.85rem, 2vw, 1rem);
    max-width: 500px;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .controls-hint {
    font-size: 0.8rem;
    color: #00f3ff;
    background: rgba(0, 243, 255, 0.1);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .btn-launch {
    padding: 14px 36px;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    color: #04060e;
    background: #00f3ff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
    transition: all 0.2s ease;
  }
  .btn-launch:hover {
    background: #ffffff;
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
  }
  .hud-display {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    font-weight: 700;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 0 8px rgba(0, 243, 255, 0.7);
  }
  .shield-bar-wrap {
    width: 120px;
    height: 10px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid #00f3ff;
    border-radius: 5px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    margin-left: 8px;
  }
  #shield-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #00f3ff, #00ff88);
    transition: width 0.2s ease, background 0.2s ease;
  }
</style>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div class="scanlines"></div>

  <div id="start-screen" class="screen-overlay">
    <h1>CYBER BLASTAR</h1>
    <p class="tagline">Neutralize rogue malware packets before they breach the core firewall.</p>
    <div class="controls-hint">[ARROWS / A-D / TOUCH] Steer &nbsp;•&nbsp; [SPACE / AUTO] Pulse Laser</div>
    <button class="btn-launch" onclick="beginSimulation()">BOOT SYSTEMS</button>
  </div>

  <div id="gameover-screen" class="screen-overlay hidden">
    <h1>CRITICAL BREACH</h1>
    <p class="tagline">Core firewall infrastructure compromised.</p>
    <p style="font-size: 1.3rem; margin: 10px 0;">SCORE: <span id="final-score" style="color:#fff;">0</span></p>
    <button class="btn-launch" onclick="restartSimulation()">REBOOT FIRMWARE</button>
  </div>

  <div class="hud-display">
    <div>SCORE: <span id="ui-score">0</span></div>
    <div>WAVE: <span id="ui-wave">1</span></div>
    <div>
      FIREWALL
      <div class="shield-bar-wrap"><div id="shield-fill"></div></div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const uiScore = document.getElementById('ui-score');
    const uiWave = document.getElementById('ui-wave');
    const shieldFill = document.getElementById('shield-fill');
    const finalScore = document.getElementById('final-score');

    // Web Audio API Synthesizer (No external audio files needed)
    let audioCtx = null;
    function playSound(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'explosion') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'damage') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, now);
        osc.frequency.linearRampToValueAtTime(45, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    let gameActive = false;
    let score = 0;
    let shield = 100;
    let wave = 1;
    let keys = {};
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let spawnTimer = 0;
    let fireCooldown = 0;
    let shakeTime = 0;
    let gridOffset = 0;
    let pointerX = null;

    const player = { x: 400, y: 535, width: 44, height: 34, speed: 7, tilt: 0 };

    // Initialize Starfield
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * 800,
        y: Math.random() * 600,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.5 + 0.5
      });
    }

    // Keyboard & Touch/Mouse Controls
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && gameActive) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function updatePointer(e) {
      if (!gameActive) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      pointerX = ((clientX - rect.left) / rect.width) * canvas.width;
    }
    canvas.addEventListener('pointerdown', updatePointer);
    canvas.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') updatePointer(e); });
    canvas.addEventListener('pointerup', () => pointerX = null);

    function createExplosion(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: Math.random() * 0.03 + 0.02,
          size: Math.random() * 3.5 + 1.5,
          color
        });
      }
    }

    function updateHUD() {
      uiScore.textContent = score.toLocaleString();
      wave = Math.floor(score / 1000) + 1;
      uiWave.textContent = wave;
      shieldFill.style.width = Math.max(0, shield) + '%';
      shieldFill.style.background = shield > 40 ? 'linear-gradient(90deg, #00f3ff, #00ff88)' : '#ff2a6d';
    }

    function resetState() {
      score = 0;
      shield = 100;
      wave = 1;
      bullets = [];
      enemies = [];
      particles = [];
      spawnTimer = 0;
      player.x = 400;
      updateHUD();
    }

    window.beginSimulation = function() {
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      resetState();
      gameActive = true;
      requestAnimationFrame(gameLoop);
    };

    window.restartSimulation = function() {
      window.beginSimulation();
    };

    function drawBackground() {
      ctx.fillStyle = '#04060e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Moving Cyber Grid
      gridOffset = (gridOffset + 1.5) % 40;
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.07)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = gridOffset; y <= canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Parallax Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
        ctx.globalAlpha = s.size / 2.5;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      // Firewall Defense Line at Bottom
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 580);
      ctx.lineTo(canvas.width, 580);
      ctx.stroke();
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.tilt * 0.15);

      // Thruster Flame
      const flameH = 12 + Math.random() * 10;
      ctx.fillStyle = '#ff9900';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff5500';
      ctx.beginPath();
      ctx.moveTo(-7, 14);
      ctx.lineTo(7, 14);
      ctx.lineTo(0, 14 + flameH);
      ctx.closePath();
      ctx.fill();

      // Sleek Vector Fighter Hull
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#00f3ff';
      ctx.fillStyle = '#0a192f';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(22, 14);
      ctx.lineTo(8, 10);
      ctx.lineTo(0, 16);
      ctx.lineTo(-8, 10);
      ctx.lineTo(-22, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cockpit Core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(4, 4);
      ctx.lineTo(-4, 4);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      e.angle += 0.04;
      ctx.rotate(e.angle);

      ctx.shadowBlur = 15;
      ctx.shadowColor = e.color;
      ctx.strokeStyle = e.color;
      ctx.fillStyle = 'rgba(255, 42, 109, 0.18)';
      ctx.lineWidth = 2.5;

      // Hexagon Malware Node
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i;
        const px = Math.cos(a) * e.radius;
        const py = Math.sin(a) * e.radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Inner Glowing Core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      if (!gameActive) return;

      ctx.save();
      if (shakeTime > 0) {
        shakeTime--;
        ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
      }

      drawBackground();

      // Player Steering
      player.tilt = 0;
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 28) {
        player.x -= player.speed;
        player.tilt = -1;
      }
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - 28) {
        player.x += player.speed;
        player.tilt = 1;
      }
      if (pointerX !== null) {
        const diff = pointerX - player.x;
        if (Math.abs(diff) > 4) {
          player.x += Math.sign(diff) * Math.min(Math.abs(diff), player.speed + 2);
          player.tilt = Math.sign(diff);
        }
      }

      // Firing (Spacebar or Touch auto-fire)
      if (fireCooldown > 0) fireCooldown--;
      if ((keys['Space'] || pointerX !== null) && fireCooldown === 0) {
        bullets.push({ x: player.x, y: player.y - 22, speed: 12 });
        playSound('shoot');
        fireCooldown = 11;
      }

      drawPlayer();

      // Update & Draw Plasma Bolts
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f3ff';
      ctx.fillStyle = '#ffffff';
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        ctx.fillRect(b.x - 2, b.y, 4, 16);
        if (b.y < -20) bullets.splice(i, 1);
      }
      ctx.shadowBlur = 0;

      // Spawn Malware Nodes
      spawnTimer++;
      const spawnRate = Math.max(20, 48 - wave * 3);
      if (spawnTimer > spawnRate) {
        const isFast = Math.random() < 0.25;
        enemies.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -25,
          radius: isFast ? 14 : 20,
          speed: (isFast ? 3.5 : 2.1) + Math.random() * 1.2 + (wave * 0.25),
          color: isFast ? '#ffbe0b' : '#ff2a6d',
          angle: 0
        });
        spawnTimer = 0;
      }

      // Update & Draw Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;
        drawEnemy(e);

        // Bullet Collision
        let destroyed = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          let b = bullets[j];
          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < e.radius + 6) {
            createExplosion(e.x, e.y, e.color, 22);
            playSound('explosion');
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 100;
            updateHUD();
            destroyed = true;
            break;
          }
        }
        if (destroyed) continue;

        // Firewall Breach Check
        if (e.y > 580) {
          createExplosion(e.x, 580, '#ff2a6d', 28);
          playSound('damage');
          shakeTime = 14;
          enemies.splice(i, 1);
          shield -= 20;
          updateHUD();
          if (shield <= 0) {
            gameActive = false;
            finalScore.textContent = score.toLocaleString();
            gameoverScreen.classList.remove('hidden');
          }
        }
      }

      // Update & Draw Explosion Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }
  })();
</script>
